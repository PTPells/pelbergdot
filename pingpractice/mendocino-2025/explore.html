<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mendocino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Instrument+Sans:wght@400;500&display=swap">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            --page: #ffffff;
            --ink: #000000;
            --muted: rgba(0, 0, 0, 0.35);
            --ping: #021E6B;
            --footer-bg: #f9f9fb;
            --sans: "Instrument Sans", system-ui, sans-serif;
            --serif: "Cormorant Garamond", Georgia, serif;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            background: var(--page);
            color: var(--ink);
            font-family: var(--sans);
            font-size: 16px;
            font-weight: 400;
            overscroll-behavior-y: none;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: opacity .3s;
        }

        a:hover {
            opacity: 0.5;
        }

        /** Nav **/

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px;
            background: var(--page);
        }

        .nav-links {
            display: flex;
            gap: 32px;
        }

        .nav .here {
            opacity: 0.35;
        }

        /** Stage **/

        .stage {
            position: relative;
            height: 100dvh;
            min-height: 680px;
            padding-top: 150px;
            overflow: hidden;
            touch-action: none;
        }

        .masthead {
            position: relative;
            z-index: 2;
            text-align: center;
            pointer-events: none;
        }

        .masthead h1 {
            margin: 0;
            font-family: var(--serif);
            font-style: italic;
            font-weight: 400;
            font-size: 34px;
            line-height: 1.2;
        }

        .masthead p {
            margin: 8px 0 0;
            font-size: 13px;
            color: var(--muted);
        }

        .masthead a {
            pointer-events: auto;
        }

        .canvas {
            position: absolute;
            left: 0;
            right: 0;
            top: 230px;
            bottom: 0;
            overflow: hidden;
        }

        /** Cards **/

        .card {
            position: absolute;
            left: 50%;
            top: 50%;
            border-radius: 10px;
            overflow: hidden;
            --shadow: 0 5px 22px rgba(0, 0, 0, 0.22);
            --ring: 0 0 0 0 transparent;
            box-shadow: var(--shadow), var(--ring);
            background: linear-gradient(160deg, rgba(40, 40, 40, 0.8), rgba(20, 20, 20, 0.8));
            will-change: transform, opacity;
            transition: box-shadow .5s ease;
        }

        /* a faint rim keeps overlapping cards legible against each other */
        .card.ping {
            --ring: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
        }

        /* the ping you are meant to be reading sits up off the page */
        .card.focus {
            --shadow: 0 14px 46px rgba(0, 0, 0, 0.34);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card.ping {
            background: var(--ping);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 26px 28px;
        }

        .card.ping .body {
            font-family: var(--serif);
            font-size: 21px;
            line-height: 1.38;
            margin: 14px 0;
        }

        .meta {
            font-family: var(--sans);
            font-size: 10.5px;
            letter-spacing: 0.03em;
            opacity: 0.55;
        }

        .card figcaption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 26px 14px 10px;
            color: #fff;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
        }

        .card figure {
            margin: 0;
            height: 100%;
        }

        /* atmospheric haze: the further back a card sits, the paler it reads */
        .haze {
            position: absolute;
            inset: 0;
            background: var(--page);
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }

        /** Hint + progress **/

        .hint {
            position: absolute;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            pointer-events: none;
            z-index: 2000;
            white-space: nowrap;
        }

        .progress {
            position: absolute;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            width: 120px;
            height: 1px;
            background: rgba(0, 0, 0, 0.14);
            pointer-events: none;
            z-index: 2000;
        }

        .progress span {
            display: block;
            height: 100%;
            width: 0;
            background: var(--ink);
        }

        /** Footer **/

        footer {
            background: var(--footer-bg);
            padding: 32px 15px 24px;
        }

        .footer-top,
        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
        }

        .footer-bottom {
            align-items: center;
            font-size: 13px;
            color: var(--muted);
        }

        .footer-links {
            display: flex;
            gap: 32px;
        }

        .wordmark {
            font-family: var(--serif);
            font-style: italic;
            font-weight: 400;
            font-size: clamp(64px, 17vw, 220px);
            line-height: 1;
            letter-spacing: -0.02em;
            margin: 40px 0 36px;
            text-align: center;
            white-space: nowrap;
        }

        /** Responsive **/

        @media (max-width: 809px) {
            .stage {
                padding-top: 120px;
            }

            .canvas {
                top: 190px;
            }

            .nav {
                padding: 16px 15px;
                font-size: 14px;
            }

            .nav-links {
                gap: 18px;
            }

            .nav .here {
                display: none;
            }

            .masthead h1 {
                font-size: 28px;
            }

            .footer-top,
            .footer-bottom {
                flex-direction: column;
                gap: 12px;
            }

            .footer-links {
                gap: 20px;
            }
        }
    </style>
</head>

<body>
    <header class="nav">
        <a href="https://pelberg.com">Peter Pelberg</a>
        <nav class="nav-links">
            <a href="https://pelberg.com/pingpractice/">Pings</a>
            <a href="./explore.html" class="here">Mendocino</a>
            <a href="https://pingpractice.org">Ping Practice</a>
        </nav>
    </header>

    <main class="stage" id="stage">
        <div class="masthead">
            <h1>Mendocino</h1>
            <p>Pings published by <a href="https://pelberg.com">Peter Pelberg</a> &bull; friday, march 20, 2026</p>
        </div>

        <div class="canvas" id="canvas">
            <div class="hint" id="hint">scroll to explore</div>
            <div class="progress" id="progress" style="opacity:0"><span></span></div>
        </div>
    </main>

    <footer>
        <div class="footer-top">
            <a href="https://pelberg.com">pelberg.com</a>
            <div class="footer-links">
                <a href="https://pelberg.com/pingpractice/">Pings</a>
                <a href="./index.html">Scroll version</a>
                <a href="https://pingpractice.org">Ping Practice</a>
            </div>
        </div>
        <div class="wordmark">Mendocino</div>
        <div class="footer-bottom">
            <span>Pings published by Peter Pelberg &bull; friday, march 20, 2026</span>
            <span>via <a href="https://pingpractice.org">Ping Practice</a></span>
        </div>
    </footer>

    <script>
        (() => {
            // Relative so the photos come off this domain, and still resolve when the file
            // is opened straight from disk.
            const raw = (name) => '../../site/assets/' + name;

            // Each ping is a card floating at some depth. Order is chronological.
            const CARDS = [
                { type: 'ping', time: '10:34 pm • monday, april 21, 2025', text: 'im going to bed feeling optimistic about going to turkey', n: 'Ping 9,214 of 10,800', w: 340, h: 230 },
                { type: 'ping', time: '10:34 pm • monday, april 21, 2025', text: 'I think it might offer the kind of space I’ve noticed myself needing to reflect and dream', n: 'Ping 9,215 of 10,800', w: 320, h: 265 },
                { type: 'ping', time: '8:04 pm • monday, april 28, 2025', text: 'I feel really grounded in the choice to not go to turkey', n: 'Ping 9,260 of 10,800', w: 330, h: 230 },
                { type: 'ping', time: '8:04 pm • monday, april 28, 2025', text: 'I’m proud of myself for how long I allowed myself to live in the discomfort', n: 'Ping 9,261 of 10,800', w: 320, h: 255 },
                { type: 'ping', time: '8:06 pm • monday, april 28, 2025', text: 'in many ways, today felt unfamiliar…new…as if making this choice helped me take a step into the future…', n: 'Ping 9,264 of 10,800', w: 360, h: 275 },
                { type: 'ping', time: '7:21 pm • tuesday, april 29, 2025', text: '@dad: the drive can be relaxing', n: 'Ping 9,274 of 10,800', w: 300, h: 200 },
                { type: 'photo', src: raw('mendocino-1may2025.jpeg'), time: '8:47pm • thursday, may 1, 2025', w: 240, h: 319 },
                { type: 'ping', time: '8:40 pm • thursday, may 1, 2025', text: 'One of the scariest part of meeting in need is not knowing where it might take you', n: 'Ping 9,281 of 10,800', w: 330, h: 255 },
                { type: 'photo', src: raw('poppy-2may2025.jpg'), time: '2:18pm • friday, may 2, 2025', w: 231, h: 308 },
                { type: 'ping', time: '2:19 pm • friday, may 2, 2025', text: 'the vision doesn’t neee to crystal clear, @peter…remember the sketch from February 2022', n: 'Ping 9,287 of 10,800', w: 340, h: 265 },
                { type: 'photo', src: raw('21feb2022-1910.jpeg'), time: '7:10pm • monday, february 21, 2022', w: 380, h: 285 },
                { type: 'ping', time: '7:29 pm • friday, may 2, 2025', text: 'big day, Peter...tonight is about ease and rest', n: 'Ping 9,292 of 10,800', w: 310, h: 215 },
                { type: 'photo', src: raw('text-3may2026.jpg'), time: '11:50am • saturday, may 3, 2025', w: 260, h: 319 }
            ];

            // No two pings ever share a depth. On a wide screen consecutive pings sit half a
            // layer apart and are thrown to opposite sides: they compose as a pair, but the
            // nearer one is always larger, sharper and in front, so there is never a question
            // of which one to read. Narrow screens space them a full layer apart, one at a time.
            const XS = [200, 225, 185, 215, 195, 230, 205];
            const YS = [-80, 60, 40, -100, -45, 85, -65, 25];
            const PAIR_STEP = 0.55;              // depth between neighbours on a wide screen
            const place = (i, paired) => {
                const layer = i * (paired ? PAIR_STEP : 1);
                if (i === CARDS.length - 1) return { layer, x: 0, y: 0 };  // last ping lands dead centre
                const side = i % 2 === 0 ? -1 : 1;
                return paired
                    ? { layer, x: side * XS[i % XS.length], y: YS[i % YS.length] }
                    : { layer, x: side * 40, y: YS[i % YS.length] * 0.35 };
            };

            const lastLayer = (paired) => (CARDS.length - 1) * (paired ? PAIR_STEP : 1);
            const PAIR_WIDTH = 900;              // below this, one ping per layer
            const RATIO = 1.6;        // scale between adjacent depth layers
            const SCROLL_SPEED = 0.003;
            const SCROLL_LERP = 0.08;
            const MOUSE_LERP = 0.06;
            const PARALLAX = 40;

            const stage = document.getElementById('stage');
            const canvas = document.getElementById('canvas');
            const hint = document.getElementById('hint');
            const progress = document.getElementById('progress');
            const progressFill = progress.firstElementChild;
            const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

            const nodes = CARDS.map((card, i) => {
                const el = document.createElement('div');
                el.className = 'card ' + (card.type === 'ping' ? 'ping' : 'photo');
                el.style.width = card.w + 'px';
                // ping cards grow to their text; photo cards keep the source aspect ratio
                el.style[card.type === 'ping' ? 'minHeight' : 'height'] = card.h + 'px';
                if (card.type === 'ping') {
                    el.innerHTML =
                        '<div class="meta">' + esc(card.time) + '</div>' +
                        '<div class="body">' + esc(card.text) + '</div>' +
                        '<div class="meta">' + esc(card.n) + '</div>';
                } else {
                    el.innerHTML =
                        '<figure><img src="' + card.src + '" alt="" draggable="false" loading="lazy">' +
                        '<figcaption class="meta">' + esc(card.time) + '</figcaption></figure>';
                }
                const haze = document.createElement('div');
                haze.className = 'haze';
                el.appendChild(haze);
                canvas.appendChild(el);
                return { el, haze, index: i, pos: place(i, true), show: card.type === 'ping' ? 'flex' : 'block' };
            });

            let target = 0, current = 0;                 // depth position, in layers
            let mouse = { x: 0, y: 0 }, eased = { x: 0, y: 0 };
            let fit = 1, spreadX = 1, spreadY = 1;
            let paired = true, LAYERS = lastLayer(true);

            const MAX_W = 380, MAX_H = 340;              // largest card in the deck

            // Narrow screens shrink the spread between cards rather than the cards
            // themselves, so a ping stays readable when it reaches the front.
            const measure = () => {
                const r = canvas.getBoundingClientRect();

                const nowPaired = r.width >= PAIR_WIDTH;
                if (nowPaired !== paired) {
                    paired = nowPaired;
                    const before = LAYERS;
                    LAYERS = lastLayer(paired);
                    for (const n of nodes) n.pos = place(n.index, paired);
                    // keep the reader roughly where they were in the sequence
                    const ratio = before ? LAYERS / before : 1;
                    target *= ratio;
                    current *= ratio;
                }

                fit = Math.max(0.4, Math.min(1, (r.width - 24) / MAX_W, (r.height - 24) / MAX_H));
                spreadX = Math.min(1, (r.width / 2 - MAX_W * fit / 2 + 60) / 230);
                spreadY = Math.min(1, (r.height / 2 - MAX_H * fit / 2 + 40) / 110);
                // no card may hang off the canvas when it is at the front
                for (const n of nodes) {
                    n.maxX = Math.max(0, (r.width / 2 - n.el.offsetWidth * fit / 2 - 8) / fit);
                    n.maxY = Math.max(0, (r.height / 2 - n.el.offsetHeight * fit / 2 - 8) / fit);
                }
            };
            measure();
            window.addEventListener('resize', measure);
            window.addEventListener('load', measure);
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

            const clamp = (v, m) => Math.max(-m, Math.min(m, v));

            const advance = (delta) => {
                target = Math.max(0, Math.min(LAYERS, target + delta));
            };

            // Past the last ping the gesture belongs to the page again, so the footer is
            // reachable; the same going back the other way.
            const handsOff = (dy) => (dy > 0 && target >= LAYERS) || (dy < 0 && window.scrollY > 0);

            stage.addEventListener('wheel', (e) => {
                if (handsOff(e.deltaY)) return;              // let the page scroll
                e.preventDefault();
                advance(e.deltaY * SCROLL_SPEED);
            }, { passive: false });

            let touchY = null;
            stage.addEventListener('touchstart', (e) => { touchY = e.touches[0].clientY; }, { passive: true });
            stage.addEventListener('touchmove', (e) => {
                if (touchY === null) return;
                const dy = touchY - e.touches[0].clientY;
                touchY = e.touches[0].clientY;
                e.preventDefault();                          // touch-action is none here
                if (handsOff(dy)) window.scrollBy(0, dy);
                else advance(dy * 0.006);
            }, { passive: false });
            stage.addEventListener('touchend', () => { touchY = null; });

            window.addEventListener('keydown', (e) => {
                if (window.scrollY > 0) return;              // reading the footer
                if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ') { advance(0.5); e.preventDefault(); }
                else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { advance(-0.5); e.preventDefault(); }
            });

            if (!reduced) {
                window.addEventListener('mousemove', (e) => {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = (e.clientY / window.innerHeight) * 2 - 1;
                });
            }

            let focused = null;

            const render = () => {
                current += (target - current) * (reduced ? 1 : SCROLL_LERP);
                eased.x += (mouse.x - eased.x) * MOUSE_LERP;
                eased.y += (mouse.y - eased.y) * MOUSE_LERP;

                let nearest = null, nearestR = Infinity;

                for (const node of nodes) {
                    const { el, haze, pos, show, maxX, maxY } = node;
                    const r = pos.layer - current;
                    if (r < -0.4 || r > 2.5) { el.style.display = 'none'; continue; }

                    if (r >= -0.15 && r < nearestR) { nearest = node; nearestR = r; }

                    const scale = fit * Math.pow(1 / RATIO, r);
                    let opacity = 1;
                    if (r < 0) opacity = Math.max(0, 1 + r / 0.4);
                    else if (r > 1.8) opacity = Math.max(0, 1 - (r - 1.8) / 0.7);

                    const x = (clamp(pos.x * spreadX, maxX) + eased.x * PARALLAX) * scale;
                    const y = (clamp(pos.y * spreadY, maxY) + eased.y * PARALLAX) * scale;

                    el.style.display = show;
                    el.style.opacity = opacity;
                    haze.style.opacity = Math.min(0.5, Math.max(0, r) * 0.34);
                    el.style.zIndex = Math.round(1000 - r * 100);
                    el.style.transform =
                        'translate3d(' + x + 'px, ' + y + 'px, 0) translate(-50%, -50%) scale(' + scale + ')';
                }

                if (nearest !== focused) {
                    if (focused) focused.el.classList.remove('focus');
                    if (nearest) nearest.el.classList.add('focus');
                    focused = nearest;
                }

                const pct = LAYERS ? current / LAYERS : 0;
                hint.style.opacity = Math.max(0, 1 - current / 0.6);
                progress.style.opacity = Math.min(1, current / 0.6);
                progressFill.style.width = (pct * 100) + '%';

                requestAnimationFrame(render);
            };
            requestAnimationFrame(render);
        })();
    </script>
</body>

</html>
